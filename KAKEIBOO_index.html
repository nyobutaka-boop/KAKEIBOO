<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152f"><link rel="manifest" href="manifest.webmanifest"><title>KAKEIBOO｜ローカル家計簿</title>
<style>
:root{--bg:#080d20;--panel:#141d3a;--panel2:#1c2850;--line:#34436d;--txt:#f6f7ff;--muted:#aab6d6;--pink:#ff258e;--cyan:#00e5dc;--lime:#b6ff45;--gold:#ffd447}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#25205b 0,transparent 38%),var(--bg);color:var(--txt);font-family:system-ui,"Noto Sans JP",sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1127ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.08em}.logo span{color:var(--cyan)}.wrap{max-width:980px;margin:auto;padding:14px 14px 100px}.month{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.month button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 13px;border-radius:12px;font-weight:700}.month strong{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:linear-gradient(145deg,#19244b,#111a36);border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:5px}.pink{color:#ff78ba}.cyan{color:var(--cyan)}.lime{color:var(--lime)}.gold{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.panel h3{margin:0 0 12px;font-size:16px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap}.tabs button.active{background:linear-gradient(110deg,var(--pink),#7b42ff);border-color:transparent}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input,.row select{flex:1}input,select,textarea{width:100%;background:#0b1430;border:1px solid #42527f;border-radius:10px;color:var(--txt);padding:11px;font:inherit;margin:4px 0}label{display:block;color:var(--muted);font-size:12px;margin-top:9px}.primary{background:linear-gradient(110deg,var(--pink),#8544ff);border:0;color:white}.wide{width:100%;margin-top:10px}.entry{padding:11px 0;border-bottom:1px solid #2b385e;display:flex;justify-content:space-between;gap:10px}.entry:last-child{border:0}.entry small{display:block;color:var(--muted);margin-top:4px}.entry .amt{font-weight:800;white-space:nowrap}.negative{color:#ff7eb7}.positive{color:var(--lime)}.hide{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1127f5;border-top:1px solid var(--line);padding:9px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:6}.bottom button{background:none;color:var(--muted);font-size:12px;padding:7px}.bottom button.active{color:var(--cyan)}.thumbs{display:flex;gap:7px;flex-wrap:wrap}.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.hint{color:var(--muted);font-size:12px;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px}.danger{color:#ff829f}.bar{height:9px;background:#27365f;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#26365e;color:#c8d7ff;font-size:11px}
</style></head><body>
<header><div class="logo">KAKEI<span>BOO</span> <small style="color:#aab6d6;font-size:10px">LOCAL EDITION</small></div><span class="pill">端末内保存</span></header>
<div class="wrap">
<div class="month"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div>
<div id="home">
<div class="grid"><div class="stat"><small>今月の支出</small><b class="pink" id="spend">¥0</b></div><div class="stat"><small>今月の収入</small><b class="lime" id="income">¥0</b></div><div class="stat"><small>固定費</small><b class="gold" id="fixedTotal">¥0</b></div><div class="stat"><small>差引残高</small><b class="cyan" id="balance">¥0</b></div></div>
<div class="panel"><h3>カテゴリー別支出</h3><div id="categorySummary"></div></div>
<div class="panel"><h3>最近の記録</h3><div id="recent"></div><button class="btn primary wide" id="addFromHome">＋ 支出を入力</button></div>
</div>
<div id="formView" class="hide panel"><h3 id="formTitle">支出を入力</h3><input type="hidden" id="editId"><label>日付</label><input id="date" type="date"><label>種類</label><select id="kind"><option value="expense">支出</option><option value="income">収入</option></select><label>金額（円）</label><input id="amount" type="number" inputmode="numeric" placeholder="例：580"><label>カテゴリー</label><select id="category"></select><label>お店・内容 / メモ</label><textarea id="note" rows="2" placeholder="例：スーパー、昼食など"></textarea><label>画像添付（最大5枚）</label><input id="images" type="file" accept="image/*" multiple><div class="thumbs" id="imagePreview"></div><p class="hint">画像はこの端末内に保存されます。画像を含むデータはバックアップファイルも大きくなる場合があります。</p><button class="btn primary wide" id="save">保存する</button><button class="btn wide" id="cancel">キャンセル</button></div>
<div id="records" class="hide panel"><h3>記録一覧</h3><div id="allRecords"></div></div>
<div id="annual" class="hide panel"><h3>年間集計</h3><div id="annualRows"></div></div>
<div id="settings" class="hide">
<div class="panel"><h3>固定費設定</h3><p class="hint">毎月の固定費を編集できます。家賃85,000円、都民共済・日生44,000円を初期値にしています。</p><div id="fixedList"></div><div class="row"><input id="fixedName" placeholder="項目名"><input id="fixedAmount" type="number" placeholder="金額"></div><button class="btn primary wide" id="addFixed">固定費を追加</button><button class="btn wide" id="saveFixed">固定費を保存</button></div>
<div class="panel"><h3>カテゴリー設定</h3><div id="catList"></div><div class="row"><input id="newCat" placeholder="新しいカテゴリー"><button class="btn primary" id="addCat">追加</button></div></div>
<div class="panel"><h3>データのバックアップ・復元</h3><p class="hint">データはこのブラウザ内に保存されます。定期的にバックアップをダウンロードしてください。復元は現在のデータに追加せず、内容を置き換えます。</p><button class="btn primary wide" id="export">バックアップを書き出す</button><label>バックアップファイルを読み込む</label><input id="importFile" type="file" accept=".json,application/json"><button class="btn wide" id="restore">選択したバックアップで復元</button><p class="hint" id="storageInfo"></p></div>
</div>
</div>
<nav class="bottom"><button data-tab="home" class="active">⌂ ホーム</button><button data-tab="formView">＋ 入力</button><button data-tab="records">▤ 記録</button><button data-tab="annual">▥ 年間</button><button data-tab="settings">⚙ 設定</button></nav>
<script>
const DB='kakeiboo-local-v1', STORE='state';let db, state, month=new Date().toISOString().slice(0,7), pendingImages=[];
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function getState(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putState(){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function init(){db=await openDB();state=await getState();if(!state){state={entries:[],categories:['食費','ネット購入','日用品','交通費','医療費','交際費','趣味','その他'],income:0,fixed:[{name:'家賃',amount:85000},{name:'都民共済・日生',amount:44000},{name:'NISA・積立',amount:60000},{name:'スマホ＋Net',amount:10000},{name:'母スマホ',amount:6000},{name:'ガス・光熱費',amount:10000},{name:'水道',amount:2000}],monthlyFixed:{},monthlyCategories:{}};await putState()}render();document.getElementById('date').value=new Date().toISOString().slice(0,10)}
function fixedFor(m){return state.monthlyFixed?.[m]||state.fixed}
function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}
function render(){document.getElementById('monthTitle').textContent=month.replace('-','年')+'月';let es=state.entries.filter(e=>e.date?.startsWith(month));let spend=sum(es.filter(e=>e.amount<0),e=>-e.amount),inc=sum(es.filter(e=>e.amount>0),e=>e.amount),fix=sum(fixedFor(month),x=>x.amount);
document.getElementById('spend').textContent=yen(spend);document.getElementById('income').textContent=yen(inc+(month===new Date().toISOString().slice(0,7)?state.income||0:0));document.getElementById('fixedTotal').textContent=yen(fix);document.getElementById('balance').textContent=yen((inc+(month===new Date().toISOString().slice(0,7)?state.income||0:0))-spend-fix);
let cats={};es.filter(e=>e.amount<0).forEach(e=>cats[e.category]=(cats[e.category]||0)-e.amount);let max=Math.max(1,...Object.values(cats));document.getElementById('categorySummary').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${esc(c)}</span><b>${yen(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<p class="hint">まだ記録がありません</p>';
document.getElementById('recent').innerHTML=es.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(entryHTML).join('')||'<p class="hint">記録がありません</p>';
document.getElementById('allRecords').innerHTML=es.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(entryHTML).join('')||'<p class="hint">この月の記録はありません</p>';
let yr=month.slice(0,4);document.getElementById('annualRows').innerHTML=Array.from({length:12},(_,i)=>{let m=yr+'-'+String(i+1).padStart(2,'0'),a=state.entries.filter(e=>e.date?.startsWith(m)),v=sum(a.filter(e=>e.amount<0),e=>-e.amount),n=sum(a.filter(e=>e.amount>0),e=>e.amount);return `<div class="entry"><div>${i+1}月<small>収入 ${yen(n)} ・ 固定費 ${yen(sum(fixedFor(m),x=>x.amount))}</small></div><b class="negative">${yen(v)}</b></div>`}).join('');
document.getElementById('category').innerHTML=state.categories.map(c=>`<option>${esc(c)}</option>`).join('');document.getElementById('catList').innerHTML=state.categories.map((c,i)=>`<div class="entry"><span>${esc(c)}</span><button class="btn danger" onclick="removeCat(${i})">削除</button></div>`).join('');
document.getElementById('fixedList').innerHTML=state.fixed.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" data-fn="${i}"><input type="number" value="${x.amount}" data-fa="${i}"><button class="btn danger" onclick="removeFixed(${i})">×</button></div>`).join('');
document.getElementById('storageInfo').textContent='保存先：このブラウザの端末内データベース（IndexedDB）';
}
function entryHTML(e){return `<div class="entry"><div><b>${esc(e.category||'その他')}</b><small>${esc(e.date)} ・ ${esc(e.note||'')}</small>${e.images?.length?`<small>📷 画像 ${e.images.length}枚</small>`:''}<div class="actions"><button class="btn" onclick="editEntry('${esc(e.id)}')">編集</button><button class="btn danger" onclick="deleteEntry('${esc(e.id)}')">削除</button></div></div><div class="amt ${e.amount<0?'negative':'positive'}">${e.amount<0?'−':'+'}${yen(Math.abs(e.amount))}</div></div>`}
function tab(t){['home','formView','records','annual','settings'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==t));document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{tab(b.dataset.tab);if(b.dataset.tab==='formView')newEntry()});
document.getElementById('prev').onclick=()=>{let d=new Date(month+'-01');d.setMonth(d.getMonth()-1);month=d.toISOString().slice(0,7);render()};document.getElementById('next').onclick=()=>{let d=new Date(month+'-01');d.setMonth(d.getMonth()+1);month=d.toISOString().slice(0,7);render()};
document.getElementById('addFromHome').onclick=()=>{tab('formView');newEntry()};function newEntry(){document.getElementById('formTitle').textContent='支出を入力';document.getElementById('editId').value='';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('kind').value='expense';document.getElementById('amount').value='';document.getElementById('note').value='';pendingImages=[];document.getElementById('images').value='';preview()}
async function editEntry(id){let e=state.entries.find(x=>x.id===id);if(!e)return;tab('formView');document.getElementById('formTitle').textContent='記録を編集';document.getElementById('editId').value=id;document.getElementById('date').value=e.date;document.getElementById('kind').value=e.amount<0?'expense':'income';document.getElementById('amount').value=Math.abs(e.amount);document.getElementById('category').value=e.category;document.getElementById('note').value=e.note||'';pendingImages=e.images||[];preview()}
async function deleteEntry(id){if(!confirm('この記録を削除しますか？'))return;state.entries=state.entries.filter(e=>e.id!==id);await putState();render()}
document.getElementById('images').onchange=async ev=>{let files=[...ev.target.files].slice(0,5-pendingImages.length);for(let f of files){let data=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});pendingImages.push(data)}preview()};
function preview(){document.getElementById('imagePreview').innerHTML=pendingImages.map((x,i)=>`<div style="position:relative"><img src="${x}"><button class="btn danger" style="position:absolute;right:0;top:0;padding:2px 6px" onclick="pendingImages.splice(${i},1);preview()">×</button></div>`).join('')}
document.getElementById('save').onclick=async()=>{let id=document.getElementById('editId').value,kind=document.getElementById('kind').value,amount=Math.abs(Number(document.getElementById('amount').value));if(!amount||!document.getElementById('date').value){alert('日付と金額を入力してください');return}let item={id:id||crypto.randomUUID(),date:document.getElementById('date').value,amount:kind==='expense'?-amount:amount,category:document.getElementById('category').value,note:document.getElementById('note').value,images:pendingImages};if(id)state.entries=state.entries.map(e=>e.id===id?item:e);else state.entries.push(item);try{await putState();month=item.date.slice(0,7);render();tab('home');alert('保存しました')}catch(e){alert('保存できませんでした。端末の空き容量を確認してください')}};
document.getElementById('cancel').onclick=()=>{tab('home')};
window.removeCat=async i=>{if(confirm('カテゴリーを削除しますか？')){state.categories.splice(i,1);await putState();render()}};document.getElementById('addCat').onclick=async()=>{let v=document.getElementById('newCat').value.trim();if(v&&!state.categories.includes(v)){state.categories.push(v);document.getElementById('newCat').value='';await putState();render()}};
window.removeFixed=async i=>{state.fixed.splice(i,1);await putState();render()};document.getElementById('addFixed').onclick=()=>{let n=document.getElementById('fixedName').value.trim(),a=Number(document.getElementById('fixedAmount').value);if(n&&a>=0){state.fixed.push({name:n,amount:a});document.getElementById('fixedName').value='';document.getElementById('fixedAmount').value='';render()}};
document.getElementById('saveFixed').onclick=async()=>{document.querySelectorAll('[data-fn]').forEach(x=>state.fixed[+x.dataset.fn].name=x.value);document.querySelectorAll('[data-fa]').forEach(x=>state.fixed[+x.dataset.fa].amount=Number(x.value)||0);await putState();render();alert('固定費を保存しました')};
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({backupFormat:'KAKEIBOO_LOCAL_V1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakeiboo-local-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
let chosen=null;document.getElementById('importFile').onchange=e=>chosen=e.target.files[0];document.getElementById('restore').onclick=async()=>{if(!chosen)return alert('先にバックアップファイルを選んでください');if(!confirm('現在の端末内データを、選択したバックアップで置き換えます。事前にバックアップしましたか？'))return;try{let j=JSON.parse(await chosen.text());let s=j.state||j;if(!Array.isArray(s.entries))throw Error('形式が違います');state={entries:s.entries.map((e,i)=>({id:e.id||'restore-'+i,date:e.date,amount:Number(e.amount)||0,category:e.category||'その他',note:e.note||'',images:e.images||[]})),categories:s.categories||['食費','その他'],income:s.income||0,fixed:(s.fixed||[]).map(x=>({name:x.name,amount:Math.abs(Number(x.amount)||0)})),monthlyFixed:s.monthlyFixed||{},monthlyCategories:s.monthlyCategories||{}};await putState();render();alert('復元しました')}catch(e){alert('復元できませんでした：'+e.message)}};
init().catch(e=>alert('初期化エラー：'+e.message));
</script></body></html>
<script>if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
